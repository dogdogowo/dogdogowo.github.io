<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>osu! 宣傳頁面</title>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Varela Round', 'Comfortaa', sans-serif; margin:0; padding:0; background-color: #ff66aa; }

/* 自訂顏色 & 圓角 */
.bg-osu-pink { background-color: #ff66aa; }
.bg-osu-pink2 { background-color: #ff99cc; }
.bg-osu-purple { background-color: #b266ff; }
.text-osu-pink { color: #ff66aa; }
.rounded-pill { border-radius: 999px; }
.rounded-card { border-radius: 20px; }

/* News Card hover流光效果 */
.osu-card {
  position: relative;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.osu-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: -75%;
  width: 50%;
  height: 100%;
  background: linear-gradient(to right, #b1a9ac, transparent);
  transform: rotate(12deg);
  opacity: 0;
  filter: blur(12px);
  transition: all 0.7s;
}
.osu-card:hover::before {
  left: 100%;
  opacity: 0.5;
}
.osu-card:hover {
  transform: translateY(-6px) scale(1.03);
  box-shadow: 0 0 25px rgba(160, 80, 255, 0.4);
}

/* Hero 背景圓圈動畫 */
.animate-spin-slow { animation: spin-slow 60s linear infinite; }
@keyframes spin-slow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Mobile Menu */
#mobileMenu {
  display: none; 
  flex-direction: column;
  gap: 1rem;
  padding-bottom: 1rem;
  text-align: center;
}
#mobileMenu.show { display: flex; }

</style>
</head>
<body class="text-white">

<!-- Navbar -->
<!-- Navbar -->

    </li>
  </ul>
  <button class="md:hidden text-pink-300" id="menuBtn">☰</button>
</nav>


<ul id="mobileMenu" class="md:hidden items-center space-y-4 pb-4 text-lg font-medium">
